name: Staging dual deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_igdb_webhooks:
        description: Deploy IGDB webhooks Worker even if paths did not change
        type: boolean
        default: true
      sync_igdb_webhook_secrets:
        description: Also secret-bulk the develop webhooks Worker (creates a second deploy)
        type: boolean
        default: false

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.STAGING_DATABASE_URL }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_DATABASE_URL missing; skipping migrate."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate
      - if: steps.guard.outputs.skipped == 'false'
        run: |
          echo "### Migrate (staging)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Applied \`pnpm db:migrate\` against \`STAGING_DATABASE_URL\`." >> "$GITHUB_STEP_SUMMARY"

  changes:
    runs-on: ubuntu-latest
    outputs:
      igdb_webhooks: ${{ steps.filter.outputs.igdb_webhooks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            igdb_webhooks:
              - 'workers/igdb-webhooks/**'
              - 'packages/igdb/**'
              - 'packages/db/**'
              - 'pnpm-lock.yaml'

  vercel:
    needs: migrate
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets missing; skipping staging Vercel deploy."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.STAGING_NEON_AUTH_BASE_URL || secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_WEBHOOKS_WORKER_URL: ${{ secrets.IGDB_WEBHOOKS_WORKER_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_AVATAR_BUCKET: ${{ secrets.STAGING_R2_AVATAR_BUCKET || secrets.R2_AVATAR_BUCKET }}
          AVATAR_PUBLIC_BASE_URL: ${{ secrets.STAGING_AVATAR_PUBLIC_BASE_URL || secrets.AVATAR_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          STAGING_VERCEL_APP_URL: ${{ secrets.STAGING_VERCEL_APP_URL }}
          VERCEL_STAGING_ALIAS: ${{ secrets.VERCEL_STAGING_ALIAS }}
        run: |
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          pnpm exec vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

          if [ -z "$NEON_AUTH_BASE_URL" ]; then
            echo "::warning::NEON_AUTH_BASE_URL empty — set GitHub secret STAGING_NEON_AUTH_BASE_URL (or NEON_AUTH_BASE_URL)"
          fi
          if [ -z "$NEON_AUTH_COOKIE_SECRET" ]; then
            echo "::warning::NEON_AUTH_COOKIE_SECRET empty — set GitHub secret NEON_AUTH_COOKIE_SECRET"
          fi

          # Host-specific public URL (dual deploy ? not a shared STAGING_APP_URL)
          if [ -n "$STAGING_VERCEL_APP_URL" ]; then
            NEXT_PUBLIC_APP_URL="$STAGING_VERCEL_APP_URL"
          elif [ -n "$VERCEL_STAGING_ALIAS" ]; then
            NEXT_PUBLIC_APP_URL="https://${VERCEL_STAGING_ALIAS}"
          else
            NEXT_PUBLIC_APP_URL=""
          fi

          if [ -z "$IGDB_WEBHOOKS_WORKER_URL" ]; then
            IGDB_WEBHOOKS_WORKER_URL="https://thegamies-igdb-webhooks-develop.ecdm981.workers.dev"
          fi

          ARGS=(deploy --yes --token="$VERCEL_TOKEN")
          for key in DATABASE_URL NEON_AUTH_BASE_URL NEON_AUTH_COOKIE_SECRET ADMIN_SYNC_SECRET CRON_SECRET IGDB_CLIENT_ID IGDB_CLIENT_SECRET IGDB_WEBHOOKS_WORKER_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_AVATAR_BUCKET AVATAR_PUBLIC_BASE_URL NEXT_PUBLIC_GA_MEASUREMENT_ID; do
            val="${!key}"
            if [ -n "$val" ]; then
              ARGS+=(--env "${key}=${val}")
            fi
          done
          if [ -n "$NEXT_PUBLIC_APP_URL" ]; then
            ARGS+=(--env "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}")
          fi
          DEPLOY_OUT=$(pnpm exec vercel "${ARGS[@]}" | tee /dev/stderr)
          URL=$(echo "$DEPLOY_OUT" | grep -oE 'https://[^ ]+\.vercel\.app' | tail -n1)
          if [ -z "$URL" ]; then
            URL=$(echo "$DEPLOY_OUT" | tail -n1)
          fi
          if [ -n "$VERCEL_STAGING_ALIAS" ] && [ -n "$URL" ]; then
            pnpm exec vercel alias set "$URL" "$VERCEL_STAGING_ALIAS" --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" || true
            echo "Aliased to $VERCEL_STAGING_ALIAS"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secrets: GitHub Actions ? deployment env" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$VERCEL_STAGING_ALIAS" ]; then
            echo "- Alias: https://$VERCEL_STAGING_ALIAS" >> "$GITHUB_STEP_SUMMARY"
          fi

  cloudflare:
    needs: migrate
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing; skipping staging Cloudflare deploy."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.STAGING_NEON_AUTH_BASE_URL || secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_WEBHOOKS_WORKER_URL: ${{ secrets.IGDB_WEBHOOKS_WORKER_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_AVATAR_BUCKET: ${{ secrets.STAGING_R2_AVATAR_BUCKET || secrets.R2_AVATAR_BUCKET }}
          AVATAR_PUBLIC_BASE_URL: ${{ secrets.STAGING_AVATAR_PUBLIC_BASE_URL || secrets.AVATAR_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.STAGING_CF_APP_URL }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
        run: |
          WORKER="thegamies-v2-develop"
          if [ -z "$NEON_AUTH_BASE_URL" ]; then
            echo "::warning::NEON_AUTH_BASE_URL empty — set GitHub secret STAGING_NEON_AUTH_BASE_URL (or NEON_AUTH_BASE_URL)"
          fi
          if [ -z "$NEON_AUTH_COOKIE_SECRET" ]; then
            echo "::warning::NEON_AUTH_COOKIE_SECRET empty — set GitHub secret NEON_AUTH_COOKIE_SECRET"
          fi
          if [ -z "$IGDB_WEBHOOKS_WORKER_URL" ]; then
            IGDB_WEBHOOKS_WORKER_URL="https://thegamies-igdb-webhooks-develop.ecdm981.workers.dev"
            export IGDB_WEBHOOKS_WORKER_URL
          fi
          node -e "
            const fs=require('fs');
            const worker='thegamies-v2-develop';
            let s=fs.readFileSync('wrangler.jsonc','utf8');
            s=s.replaceAll('\"thegamies-v2\"', JSON.stringify(worker));
            s=s.replaceAll('9956d865bf3d4a8e92c84157db2da062', '03fe80b4d898487587901e0b6abced89');
            fs.writeFileSync('wrangler.jsonc', s);
          "

          # Build-time env for OpenNext + JSON for wrangler secret bulk (shows in CF dashboard)
          : > .dev.vars
          echo "NEXTJS_ENV=production" >> .dev.vars
          node <<'NODE'
          const fs = require("fs");
          const keys = [
            "DATABASE_URL",
            "NEON_AUTH_BASE_URL",
            "NEON_AUTH_COOKIE_SECRET",
            "ADMIN_SYNC_SECRET",
            "CRON_SECRET",
            "IGDB_CLIENT_ID",
            "IGDB_CLIENT_SECRET",
            "IGDB_WEBHOOKS_WORKER_URL",
            "R2_ACCOUNT_ID",
            "R2_ACCESS_KEY_ID",
            "R2_SECRET_ACCESS_KEY",
            "R2_AVATAR_BUCKET",
            "AVATAR_PUBLIC_BASE_URL",
            "NEXT_PUBLIC_GA_MEASUREMENT_ID",
            "NEXT_PUBLIC_APP_URL",
            "AUTH_EMAIL_FROM",
          ];
          const secrets = {};
          const lines = ["NEXTJS_ENV=production"];
          for (const key of keys) {
            const val = process.env[key];
            if (!val) continue;
            secrets[key] = val;
            // Escape newlines for dotenv-style .dev.vars
            lines.push(`${key}=${val.replace(/\n/g, "\\n")}`);
          }
          fs.writeFileSync(".dev.vars", lines.join("\n") + "\n");
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/wrangler-secrets.json",
            JSON.stringify(secrets),
          );
          const names = Object.keys(secrets);
          console.log(
            names.length
              ? `Prepared ${names.length} secrets: ${names.join(", ")}`
              : "WARNING: no app secrets set in GitHub Actions",
          );
          NODE

          pnpm exec opennextjs-cloudflare build
          DEPLOY_LOG=$(pnpm exec wrangler deploy 2>&1 | tee /dev/stderr)

          if [ -s "$RUNNER_TEMP/wrangler-secrets.json" ] && [ "$(cat "$RUNNER_TEMP/wrangler-secrets.json")" != "{}" ]; then
            pnpm exec wrangler secret bulk "$RUNNER_TEMP/wrangler-secrets.json" --name "$WORKER"
          else
            echo "Skipping wrangler secret bulk (no secrets to upload)."
          fi

          URL=$(echo "$DEPLOY_LOG" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' | head -n1)
          if [ -z "$URL" ]; then
            URL="https://${WORKER}.workers.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`$WORKER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secrets: GitHub Actions ? wrangler secret bulk" >> "$GITHUB_STEP_SUMMARY"

  igdb_webhooks:
    needs: [migrate, changes]
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.force_igdb_webhooks != 'false') ||
      needs.changes.outputs.igdb_webhooks == 'true'
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing; skipping IGDB webhooks Worker deploy."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET }}
          IGDB_WEBHOOK_SECRET: ${{ secrets.IGDB_WEBHOOK_SECRET }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const secrets = {};
          const keys = [
            ["DATABASE_URL", "DATABASE_URL"],
            ["ADMIN_SYNC_SECRET", "ADMIN_SYNC_SECRET"],
            ["IGDB_WEBHOOK_SECRET", "IGDB_WEBHOOK_SECRET"],
            ["IGDB_CLIENT_ID", "IGDB_CLIENT_ID"],
            ["IGDB_CLIENT_SECRET", "IGDB_CLIENT_SECRET"],
            ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_API_TOKEN"],
          ];
          for (const [envKey, secretKey] of keys) {
            const val = process.env[envKey];
            if (!val) continue;
            secrets[secretKey] = val;
          }
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/igdb-webhooks-secrets.json",
            JSON.stringify(secrets),
          );
          const names = Object.keys(secrets);
          console.log(
            names.length
              ? `Prepared ${names.length} IGDB webhook secrets: ${names.join(", ")}`
              : "WARNING: no IGDB webhook secrets set in GitHub Actions",
          );
          NODE

          pnpm deploy:igdb-webhooks:develop

          # secret bulk publishes a new Worker version. Skip on push so we
          # do not double-deploy; existing secrets persist across deploys.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.sync_igdb_webhook_secrets }}" = "true" ]; then
            if [ -s "$RUNNER_TEMP/igdb-webhooks-secrets.json" ] && [ "$(cat "$RUNNER_TEMP/igdb-webhooks-secrets.json")" != "{}" ]; then
              pnpm --filter @thegamies/igdb-webhooks-worker exec wrangler secret bulk "$RUNNER_TEMP/igdb-webhooks-secrets.json" --env develop
            else
              echo "Skipping wrangler secret bulk (no secrets to upload)."
            fi
          else
            echo "Skipping wrangler secret bulk (secrets already on the Worker)."
          fi

          echo "### IGDB webhooks staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`thegamies-igdb-webhooks-develop\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: \`pnpm deploy:igdb-webhooks:develop\`" >> "$GITHUB_STEP_SUMMARY"

  auth_email:
    needs: cloudflare
    runs-on: ubuntu-latest
    if: needs.cloudflare.outputs.skipped != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Point develop Auth email webhooks at staging Worker
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          CF_URL: ${{ secrets.STAGING_CF_APP_URL || needs.cloudflare.outputs.url }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "Neon API secrets missing; skip Auth email webhook."
            exit 0
          fi
          chmod +x scripts/ci/neon-branch-id.sh scripts/ci/register-neon-auth-email-webhook.sh
          BRANCH_ID=$(scripts/ci/neon-branch-id.sh develop)
          case "$CF_URL" in
            https://*)
              scripts/ci/register-neon-auth-email-webhook.sh "$BRANCH_ID" "$CF_URL"
              ;;
            *)
              echo "No Cloudflare https URL; skipping Auth email webhook."
              ;;
          esac

  summary:
    needs: [migrate, vercel, cloudflare, igdb_webhooks, auth_email]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write combined summary
        env:
          MIGRATE_SKIPPED: ${{ needs.migrate.outputs.skipped }}
          MIGRATE_RESULT: ${{ needs.migrate.result }}
          VERCEL_URL: ${{ needs.vercel.outputs.url }}
          VERCEL_SKIPPED: ${{ needs.vercel.outputs.skipped }}
          CF_URL: ${{ needs.cloudflare.outputs.url }}
          CF_SKIPPED: ${{ needs.cloudflare.outputs.skipped }}
          IGDB_RESULT: ${{ needs.igdb_webhooks.result }}
          IGDB_SKIPPED: ${{ needs.igdb_webhooks.outputs.skipped }}
        run: |
          {
            echo "## Staging deploy (develop)"
            echo ""
            echo "| Step | Status | Detail |"
            echo "| --- | --- | --- |"
            if [ "$MIGRATE_SKIPPED" = "true" ]; then
              echo "| Migrate | skipped | set \`STAGING_DATABASE_URL\` |"
            elif [ "$MIGRATE_RESULT" = "success" ]; then
              echo "| Migrate | applied | \`pnpm db:migrate\` on staging Neon |"
            else
              echo "| Migrate | $MIGRATE_RESULT | |"
            fi
            if [ "$VERCEL_SKIPPED" = "true" ]; then
              echo "| Vercel | skipped | |"
            else
              echo "| Vercel | deployed | $VERCEL_URL |"
            fi
            if [ "$CF_SKIPPED" = "true" ]; then
              echo "| Cloudflare | skipped | |"
            else
              echo "| Cloudflare | deployed | $CF_URL |"
            fi
            if [ "$IGDB_RESULT" = "skipped" ]; then
              echo "| IGDB webhooks | skipped | paths unchanged |"
            elif [ "$IGDB_SKIPPED" = "true" ]; then
              echo "| IGDB webhooks | skipped | Cloudflare secrets missing |"
            elif [ "$IGDB_RESULT" = "success" ]; then
              echo "| IGDB webhooks | deployed | \`thegamies-igdb-webhooks-develop\` |"
            else
              echo "| IGDB webhooks | $IGDB_RESULT | |"
            fi
            echo ""
            echo "Stable Cloudflare worker: \`thegamies-v2-develop\`."
            echo "App secrets from GitHub: \`STAGING_DATABASE_URL\`, \`STAGING_NEON_AUTH_BASE_URL\`, \`NEON_AUTH_COOKIE_SECRET\`, \`ADMIN_SYNC_SECRET\`, \`CRON_SECRET\`, \`IGDB_CLIENT_ID\`, \`IGDB_CLIENT_SECRET\`, \`IGDB_WEBHOOKS_WORKER_URL\`."
            echo "Per-host public URL: \`STAGING_VERCEL_APP_URL\` (or \`VERCEL_STAGING_ALIAS\`) and \`STAGING_CF_APP_URL\`."
            echo "Optional: \`VERCEL_STAGING_ALIAS\`."
          } >> "$GITHUB_STEP_SUMMARY"
