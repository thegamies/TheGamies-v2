name: Staging dual deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.STAGING_DATABASE_URL }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_DATABASE_URL missing; skipping migrate."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate
      - if: steps.guard.outputs.skipped == 'false'
        run: |
          echo "### Migrate (staging)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Applied \`pnpm db:migrate\` against \`STAGING_DATABASE_URL\`." >> "$GITHUB_STEP_SUMMARY"

  vercel:
    needs: migrate
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets missing; skipping staging Vercel deploy."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.STAGING_NEON_AUTH_BASE_URL || secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          STAGING_VERCEL_APP_URL: ${{ secrets.STAGING_VERCEL_APP_URL }}
          VERCEL_STAGING_ALIAS: ${{ secrets.VERCEL_STAGING_ALIAS }}
        run: |
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          pnpm exec vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

          if [ -z "$NEON_AUTH_BASE_URL" ]; then
            echo "::warning::NEON_AUTH_BASE_URL empty — set GitHub secret STAGING_NEON_AUTH_BASE_URL (or NEON_AUTH_BASE_URL)"
          fi
          if [ -z "$NEON_AUTH_COOKIE_SECRET" ]; then
            echo "::warning::NEON_AUTH_COOKIE_SECRET empty — set GitHub secret NEON_AUTH_COOKIE_SECRET"
          fi

          # Host-specific public URL (dual deploy ? not a shared STAGING_APP_URL)
          if [ -n "$STAGING_VERCEL_APP_URL" ]; then
            NEXT_PUBLIC_APP_URL="$STAGING_VERCEL_APP_URL"
          elif [ -n "$VERCEL_STAGING_ALIAS" ]; then
            NEXT_PUBLIC_APP_URL="https://${VERCEL_STAGING_ALIAS}"
          else
            NEXT_PUBLIC_APP_URL=""
          fi

          ARGS=(deploy --yes --token="$VERCEL_TOKEN")
          for key in DATABASE_URL NEON_AUTH_BASE_URL NEON_AUTH_COOKIE_SECRET ADMIN_SYNC_SECRET IGDB_CLIENT_ID IGDB_CLIENT_SECRET; do
            val="${!key}"
            if [ -n "$val" ]; then
              ARGS+=(--env "${key}=${val}")
            fi
          done
          if [ -n "$NEXT_PUBLIC_APP_URL" ]; then
            ARGS+=(--env "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}")
          fi
          DEPLOY_OUT=$(pnpm exec vercel "${ARGS[@]}" | tee /dev/stderr)
          URL=$(echo "$DEPLOY_OUT" | grep -oE 'https://[^ ]+\.vercel\.app' | tail -n1)
          if [ -z "$URL" ]; then
            URL=$(echo "$DEPLOY_OUT" | tail -n1)
          fi
          if [ -n "$VERCEL_STAGING_ALIAS" ] && [ -n "$URL" ]; then
            pnpm exec vercel alias set "$URL" "$VERCEL_STAGING_ALIAS" --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" || true
            echo "Aliased to $VERCEL_STAGING_ALIAS"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secrets: GitHub Actions ? deployment env" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$VERCEL_STAGING_ALIAS" ]; then
            echo "- Alias: https://$VERCEL_STAGING_ALIAS" >> "$GITHUB_STEP_SUMMARY"
          fi

  cloudflare:
    needs: migrate
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing; skipping staging Cloudflare deploy."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.STAGING_NEON_AUTH_BASE_URL || secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.STAGING_CF_APP_URL }}
        run: |
          WORKER="thegamies-v2-develop"
          if [ -z "$NEON_AUTH_BASE_URL" ]; then
            echo "::warning::NEON_AUTH_BASE_URL empty — set GitHub secret STAGING_NEON_AUTH_BASE_URL (or NEON_AUTH_BASE_URL)"
          fi
          if [ -z "$NEON_AUTH_COOKIE_SECRET" ]; then
            echo "::warning::NEON_AUTH_COOKIE_SECRET empty — set GitHub secret NEON_AUTH_COOKIE_SECRET"
          fi
          node -e "
            const fs=require('fs');
            const worker='thegamies-v2-develop';
            let s=fs.readFileSync('wrangler.jsonc','utf8');
            s=s.replaceAll('\"thegamies-v2\"', JSON.stringify(worker));
            fs.writeFileSync('wrangler.jsonc', s);
          "

          # Build-time env for OpenNext + JSON for wrangler secret bulk (shows in CF dashboard)
          : > .dev.vars
          echo "NEXTJS_ENV=production" >> .dev.vars
          node <<'NODE'
          const fs = require("fs");
          const keys = [
            "DATABASE_URL",
            "NEON_AUTH_BASE_URL",
            "NEON_AUTH_COOKIE_SECRET",
            "ADMIN_SYNC_SECRET",
            "IGDB_CLIENT_ID",
            "IGDB_CLIENT_SECRET",
            "NEXT_PUBLIC_APP_URL",
          ];
          const secrets = {};
          const lines = ["NEXTJS_ENV=production"];
          for (const key of keys) {
            const val = process.env[key];
            if (!val) continue;
            secrets[key] = val;
            // Escape newlines for dotenv-style .dev.vars
            lines.push(`${key}=${val.replace(/\n/g, "\\n")}`);
          }
          fs.writeFileSync(".dev.vars", lines.join("\n") + "\n");
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/wrangler-secrets.json",
            JSON.stringify(secrets),
          );
          const names = Object.keys(secrets);
          console.log(
            names.length
              ? `Prepared ${names.length} secrets: ${names.join(", ")}`
              : "WARNING: no app secrets set in GitHub Actions",
          );
          NODE

          pnpm exec opennextjs-cloudflare build
          DEPLOY_LOG=$(pnpm exec wrangler deploy 2>&1 | tee /dev/stderr)

          if [ -s "$RUNNER_TEMP/wrangler-secrets.json" ] && [ "$(cat "$RUNNER_TEMP/wrangler-secrets.json")" != "{}" ]; then
            pnpm exec wrangler secret bulk "$RUNNER_TEMP/wrangler-secrets.json" --name "$WORKER"
          else
            echo "Skipping wrangler secret bulk (no secrets to upload)."
          fi

          URL=$(echo "$DEPLOY_LOG" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' | head -n1)
          if [ -z "$URL" ]; then
            URL="https://${WORKER}.workers.dev"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`$WORKER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secrets: GitHub Actions ? wrangler secret bulk" >> "$GITHUB_STEP_SUMMARY"

  summary:
    needs: [migrate, vercel, cloudflare]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write combined summary
        env:
          MIGRATE_SKIPPED: ${{ needs.migrate.outputs.skipped }}
          MIGRATE_RESULT: ${{ needs.migrate.result }}
          VERCEL_URL: ${{ needs.vercel.outputs.url }}
          VERCEL_SKIPPED: ${{ needs.vercel.outputs.skipped }}
          CF_URL: ${{ needs.cloudflare.outputs.url }}
          CF_SKIPPED: ${{ needs.cloudflare.outputs.skipped }}
        run: |
          {
            echo "## Staging deploy (develop)"
            echo ""
            echo "| Step | Status | Detail |"
            echo "| --- | --- | --- |"
            if [ "$MIGRATE_SKIPPED" = "true" ]; then
              echo "| Migrate | skipped | set \`STAGING_DATABASE_URL\` |"
            elif [ "$MIGRATE_RESULT" = "success" ]; then
              echo "| Migrate | applied | \`pnpm db:migrate\` on staging Neon |"
            else
              echo "| Migrate | $MIGRATE_RESULT | |"
            fi
            if [ "$VERCEL_SKIPPED" = "true" ]; then
              echo "| Vercel | skipped | |"
            else
              echo "| Vercel | deployed | $VERCEL_URL |"
            fi
            if [ "$CF_SKIPPED" = "true" ]; then
              echo "| Cloudflare | skipped | |"
            else
              echo "| Cloudflare | deployed | $CF_URL |"
            fi
            echo ""
            echo "Stable Cloudflare worker: \`thegamies-v2-develop\`."
            echo "App secrets from GitHub: \`STAGING_DATABASE_URL\`, \`STAGING_NEON_AUTH_BASE_URL\`, \`NEON_AUTH_COOKIE_SECRET\`, \`ADMIN_SYNC_SECRET\`, \`IGDB_CLIENT_ID\`, \`IGDB_CLIENT_SECRET\`."
            echo "Per-host public URL: \`STAGING_VERCEL_APP_URL\` (or \`VERCEL_STAGING_ALIAS\`) and \`STAGING_CF_APP_URL\`."
            echo "Optional: \`VERCEL_STAGING_ALIAS\`."
          } >> "$GITHUB_STEP_SUMMARY"
