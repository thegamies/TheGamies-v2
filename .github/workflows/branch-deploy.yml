name: Manual branch deploy

# On-demand dual-host preview (Neon branch + Vercel + Cloudflare), like PR
# previews, but only when you run it.
#
# Trigger:
#   Actions → Manual branch deploy → Run workflow
#   or: pnpm deploy:branch -- <git-ref> [--slug name] [--destroy]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        type: string
      slug:
        description: Short name for Neon/CF resources (letters, numbers, hyphens)
        required: true
        type: string
      action:
        description: deploy creates/updates; destroy tears Neon + CF down
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

concurrency:
  group: manual-branch-${{ inputs.slug }}
  cancel-in-progress: true

jobs:
  prepare:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      neon_name: ${{ steps.slug.outputs.neon_name }}
      worker: ${{ steps.slug.outputs.worker }}
    steps:
      - id: slug
        env:
          RAW_SLUG: ${{ inputs.slug }}
        run: |
          SLUG=$(echo "$RAW_SLUG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
          if [ -z "$SLUG" ]; then
            echo "Slug is empty after sanitizing." >&2
            exit 1
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "neon_name=preview/manual-$SLUG" >> "$GITHUB_OUTPUT"
          echo "worker=thegamies-v2-manual-$SLUG" >> "$GITHUB_OUTPUT"

  neon:
    if: inputs.action == 'deploy'
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      # db_url cannot be a job output — GitHub strips secret-bearing outputs.
      auth_url: ${{ steps.branch.outputs.auth_url }}
      branch_id: ${{ steps.branch.outputs.branch_id }}
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.NEON_API_KEY }}" ] || [ -z "${{ secrets.NEON_PROJECT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Neon secrets missing; skipping DB branch."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: neondatabase/create-branch-action@v6
        id: branch
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ needs.prepare.outputs.neon_name }}
          parent_branch: develop
          api_key: ${{ secrets.NEON_API_KEY }}
          role: neondb_owner
          get_auth_url: true

  migrate:
    if: inputs.action == 'deploy'
    needs: [prepare, neon]
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ "${{ needs.neon.outputs.skipped }}" = "true" ] || [ -z "${{ needs.neon.outputs.branch_id }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "No Neon branch; skipping migrate."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false'
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ needs.neon.outputs.branch_id }}
        run: |
          chmod +x scripts/ci/neon-database-url.sh
          URL=$(scripts/ci/neon-database-url.sh "$BRANCH_ID")
          echo "::add-mask::$URL"
          echo "database_url=$URL" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.skipped == 'false'
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
        run: pnpm db:migrate

  vercel:
    if: inputs.action == 'deploy'
    needs: [prepare, neon, migrate]
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets missing; skipping Vercel deploy."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false' && needs.neon.outputs.skipped != 'true' && needs.neon.outputs.branch_id != ''
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ needs.neon.outputs.branch_id }}
        run: |
          chmod +x scripts/ci/neon-database-url.sh
          URL=$(scripts/ci/neon-database-url.sh "$BRANCH_ID")
          echo "::add-mask::$URL"
          echo "database_url=$URL" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.skipped == 'false'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          NEON_AUTH_BASE_URL: ${{ needs.neon.outputs.auth_url }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          if [ "${{ needs.neon.outputs.skipped }}" != "true" ] && [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is empty for Neon preview branch; refusing to deploy." >&2
            exit 1
          fi
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          pnpm exec vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          ARGS=(deploy --yes --token="$VERCEL_TOKEN")
          for key in DATABASE_URL NEON_AUTH_BASE_URL NEON_AUTH_COOKIE_SECRET ADMIN_SYNC_SECRET IGDB_CLIENT_ID IGDB_CLIENT_SECRET; do
            val="${!key}"
            if [ -n "$val" ]; then
              ARGS+=(--env "${key}=${val}")
            fi
          done
          URL=$(pnpm exec vercel "${ARGS[@]}" | tee /dev/stderr | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Vercel manual preview: $URL"

  cloudflare:
    if: inputs.action == 'deploy'
    needs: [prepare, neon, migrate]
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      skipped: ${{ steps.guard.outputs.skipped }}
    steps:
      - id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing; skipping Cloudflare deploy."
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - if: steps.guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.skipped == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skipped == 'false' && needs.neon.outputs.skipped != 'true' && needs.neon.outputs.branch_id != ''
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ needs.neon.outputs.branch_id }}
        run: |
          chmod +x scripts/ci/neon-database-url.sh
          URL=$(scripts/ci/neon-database-url.sh "$BRANCH_ID")
          echo "::add-mask::$URL"
          echo "database_url=$URL" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.skipped == 'false'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          NEON_AUTH_BASE_URL: ${{ needs.neon.outputs.auth_url }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          ADMIN_SYNC_SECRET: ${{ secrets.ADMIN_SYNC_SECRET }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          WORKER: ${{ needs.prepare.outputs.worker }}
        run: |
          if [ "${{ needs.neon.outputs.skipped }}" != "true" ] && [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is empty for Neon preview branch; refusing to deploy." >&2
            exit 1
          fi
          node -e "
            const fs=require('fs');
            const worker=process.env.WORKER;
            let s=fs.readFileSync('wrangler.jsonc','utf8');
            s=s.replaceAll('\"thegamies-v2\"', JSON.stringify(worker));
            fs.writeFileSync('wrangler.jsonc', s);
          "
          node <<'NODE'
          const fs = require("fs");
          const keys = [
            "DATABASE_URL",
            "NEON_AUTH_BASE_URL",
            "NEON_AUTH_COOKIE_SECRET",
            "ADMIN_SYNC_SECRET",
            "IGDB_CLIENT_ID",
            "IGDB_CLIENT_SECRET",
          ];
          const secrets = {};
          const lines = ["NEXTJS_ENV=production"];
          for (const key of keys) {
            const val = process.env[key];
            if (!val) continue;
            secrets[key] = val;
            lines.push(`${key}=${val.replace(/\n/g, "\\n")}`);
          }
          fs.writeFileSync(".dev.vars", lines.join("\n") + "\n");
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/wrangler-secrets.json",
            JSON.stringify(secrets),
          );
          NODE
          pnpm exec opennextjs-cloudflare build
          DEPLOY_LOG=$(pnpm exec wrangler deploy 2>&1 | tee /dev/stderr)
          if [ -s "$RUNNER_TEMP/wrangler-secrets.json" ] && [ "$(cat "$RUNNER_TEMP/wrangler-secrets.json")" != "{}" ]; then
            pnpm exec wrangler secret bulk "$RUNNER_TEMP/wrangler-secrets.json" --name "$WORKER"
          fi
          URL=$(echo "$DEPLOY_LOG" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' | head -n1)
          if [ -z "$URL" ]; then
            URL="(see wrangler deploy logs for ${WORKER})"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cloudflare manual preview: $URL"

  auth_domains:
    if: inputs.action == 'deploy'
    needs: [prepare, neon, vercel, cloudflare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register Neon Auth trusted domains
        if: needs.neon.outputs.skipped != 'true' && needs.neon.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ needs.neon.outputs.branch_id }}
          VERCEL_URL: ${{ needs.vercel.outputs.url }}
          CF_URL: ${{ needs.cloudflare.outputs.url }}
        run: |
          chmod +x scripts/ci/register-neon-auth-domains.sh
          ARGS=("$BRANCH_ID")
          for raw in "$VERCEL_URL" "$CF_URL"; do
            case "$raw" in
              https://*|http://*) ARGS+=("$raw") ;;
            esac
          done
          if [ "${#ARGS[@]}" -gt 1 ]; then
            scripts/ci/register-neon-auth-domains.sh "${ARGS[@]}"
          else
            echo "No deploy URLs to register."
          fi

  summary:
    if: inputs.action == 'deploy'
    needs: [prepare, neon, migrate, vercel, cloudflare, auth_domains]
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        env:
          SLUG: ${{ needs.prepare.outputs.slug }}
          NEON_NAME: ${{ needs.prepare.outputs.neon_name }}
          WORKER: ${{ needs.prepare.outputs.worker }}
          REF: ${{ inputs.ref }}
          NEON_SKIPPED: ${{ needs.neon.outputs.skipped }}
          MIGRATE_SKIPPED: ${{ needs.migrate.outputs.skipped }}
          VERCEL_SKIPPED: ${{ needs.vercel.outputs.skipped }}
          CF_SKIPPED: ${{ needs.cloudflare.outputs.skipped }}
          VERCEL_URL: ${{ needs.vercel.outputs.url }}
          CF_URL: ${{ needs.cloudflare.outputs.url }}
        run: |
          if [ "$NEON_SKIPPED" = "true" ]; then NEON_CELL="skipped"; else NEON_CELL="\`$NEON_NAME\`"; fi
          if [ "$MIGRATE_SKIPPED" = "true" ]; then MIGRATE_CELL="skipped"; else MIGRATE_CELL="applied"; fi
          if [ "$VERCEL_SKIPPED" = "true" ]; then VERCEL_CELL="skipped"; else VERCEL_CELL="$VERCEL_URL"; fi
          if [ "$CF_SKIPPED" = "true" ]; then CF_CELL="skipped (\`$WORKER\`)"; else CF_CELL="$CF_URL"; fi
          {
            echo "## Manual branch deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Ref | \`$REF\` |"
            echo "| Slug | \`$SLUG\` |"
            echo "| Neon branch | $NEON_CELL |"
            echo "| Migrate | $MIGRATE_CELL |"
            echo "| Vercel | $VERCEL_CELL |"
            echo "| Cloudflare | $CF_CELL |"
            echo
            echo "Destroy later with action \`destroy\` and the same slug."
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - id: slug
        env:
          RAW_SLUG: ${{ inputs.slug }}
        run: |
          SLUG=$(echo "$RAW_SLUG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "neon_name=preview/manual-$SLUG" >> "$GITHUB_OUTPUT"
          echo "worker=thegamies-v2-manual-$SLUG" >> "$GITHUB_OUTPUT"
      - id: neon_guard
        run: |
          if [ -z "${{ secrets.NEON_API_KEY }}" ] || [ -z "${{ secrets.NEON_PROJECT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.neon_guard.outputs.skipped == 'false'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ steps.slug.outputs.neon_name }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - id: cf_guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf_guard.outputs.skipped == 'false'
        uses: actions/checkout@v4
      - if: steps.cf_guard.outputs.skipped == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - if: steps.cf_guard.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.cf_guard.outputs.skipped == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ steps.slug.outputs.worker }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler delete "$WORKER" --force || true
      - name: Write destroy summary
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          NEON_NAME: ${{ steps.slug.outputs.neon_name }}
          WORKER: ${{ steps.slug.outputs.worker }}
        run: |
          {
            echo "## Manual branch destroy"
            echo
            echo "- Neon branch \`$NEON_NAME\`"
            echo "- Cloudflare worker \`$WORKER\`"
            echo "- Vercel preview deployments are left in place (expire on Vercel’s schedule)."
          } >> "$GITHUB_STEP_SUMMARY"
